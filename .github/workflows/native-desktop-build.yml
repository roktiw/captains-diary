# Build private GitLab source on GitHub-hosted machines WITHOUT mirroring source
# into this public distribution repository or publishing unreviewed binaries.
# Only non-sensitive JSON receipts are uploaded from a successful native build.
name: Native desktop build (private GitLab source)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-desktop-build.yml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character SHA of protected GitLab main (no branch or tag names)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diary-native-build-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  # Runs automatically when this workflow changes. No private GitLab source,
  # project token, or public ZIP artifacts are used in this independent probe.
  runner-probe:
    name: Host toolchain probe ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: windows-x64, runner: windows-2025 }
    steps:
      - name: Verify the actual native runner
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$RUNNER_ARCH" in
            macOS/ARM64|Linux/X64|Windows/X64) ;;
            *) echo "::error::Unexpected runner $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          echo "Native runner: $RUNNER_OS/$RUNNER_ARCH"
      - name: Prepare Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare Bun 1.3.10
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - name: Compile and run a native Bun smoke executable
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.3.10"
          src="$RUNNER_TEMP/native-probe.ts"
          exe="$RUNNER_TEMP/native-probe"
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe="$exe.exe"; fi
          printf '%s\n' 'console.log("NATIVE_PROBE_OK")' > "$src"
          bun build "$src" --compile --outfile "$exe"
          test -f "$exe"
          output="$("$exe")"
          [[ "$output" == "NATIVE_PROBE_OK" ]] || {
            echo "::error::Native Bun executable failed on $RUNNER_OS/$RUNNER_ARCH"
            exit 1
          }
          echo "Build toolchain PASS: $RUNNER_OS/$RUNNER_ARCH"

      # This public fixture is intentionally synthetic; never package private
      # GitLab source in an automatic public GitHub push event.
      - name: Package synthetic Electron Forge ZIP natively
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/diary-forge-probe"
          mkdir -p "$probe"
          cd "$probe"
          cat > package.json <<'PACKAGE'
          {
            "name": "captains-diary-forge-probe",
            "version": "0.0.1",
            "private": true,
            "description": "Synthetic Electron Forge packaging admission test. Not Captain's Diary.",
            "author": "Captain's Diary CI",
            "main": "main.cjs",
            "devDependencies": {
              "electron": "41.1.1",
              "@electron-forge/cli": "7.11.1",
              "@electron-forge/maker-zip": "7.11.1"
            }
          }
          PACKAGE
          cat > forge.config.cjs <<'FORGE'
          module.exports = {
            packagerConfig: {asar: true},
            makers: [{name: '@electron-forge/maker-zip'}]
          }
          FORGE
          cat > main.cjs <<'APP'
          const {app, BrowserWindow} = require('electron');
          app.whenReady().then(() => {
            const window = new BrowserWindow({width: 480, height: 320});
            window.loadURL('data:text/html,<h1>Forge synthetic probe</h1>');
          });
          APP
          npm install --no-audit --no-fund --save-exact
          ./node_modules/.bin/electron-forge make
          node <<'VERIFY'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = path.resolve('out/make/zip');
          function zipFiles(dir) {
            return fs.readdirSync(dir, {withFileTypes: true}).flatMap(entry => {
              const file = path.join(dir, entry.name);
              return entry.isDirectory() ? zipFiles(file) : entry.isFile() && file.endsWith('.zip') ? [file] : [];
            });
          }
          const files = zipFiles(root);
          if (files.length !== 1) throw new Error('Expected exactly one Forge ZIP, got ' + files.length);
          const file = files[0];
          const bytes = fs.statSync(file).size;
          if (bytes < 1000000) throw new Error('Unexpectedly small Forge ZIP');
          const sha256 = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          console.log(JSON.stringify({
            result: 'FORGE_PROBE_PASS',
            platform: process.platform,
            arch: process.arch,
            bytes,
            sha256,
            synthetic: true,
            captainsDiaryBuilt: false
          }));
          VERIFY

  # Real Captain's Diary builds require an explicit source SHA and secrets.
  desktop:
    if: github.event_name == 'workflow_dispatch'
    needs: runner-probe
    name: Native ${{ matrix.platform }} build and smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: windows-x64, runner: windows-2025 }
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: "true"
      CI_COMMIT_SHA: ${{ inputs.source_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}

    steps:
      - name: Clone exact protected GitLab source SHA
        shell: bash
        working-directory: .
        env:
          DIARY_GITLAB_USER: ${{ secrets.DIARY_GITLAB_READ_USER }}
          DIARY_GITLAB_READ_TOKEN: ${{ secrets.DIARY_GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
          if [[ -z "$DIARY_GITLAB_USER" || -z "$DIARY_GITLAB_READ_TOKEN" ]]; then
            echo "::error::Configure DIARY_GITLAB_READ_USER and DIARY_GITLAB_READ_TOKEN GitHub Actions secrets"
            exit 1
          fi
          # Transient per-process auth: no credentials in URLs, repository, or persisted git config.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://gitlab.com/.extraheader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf '%s:%s' "$DIARY_GITLAB_USER" "$DIARY_GITLAB_READ_TOKEN" | base64 | tr -d '\r\n')"
          GIT_TERMINAL_PROMPT=0 git clone --depth 1 --single-branch --branch main \
            https://gitlab.com/roktiw/captains-diary.git source
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          actual="$(git -C source rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "::error::Protected GitLab main tip differs from requested SHA; refusing a stale or unreviewed source"
            exit 1
          fi
          echo "Verified GitLab main SHA: $actual"

      - name: Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Bun 1.3.10
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - name: Install and check locked workspace
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.3.10"
          bun install --frozen-lockfile
          bun run check

      - name: Linux desktop libraries
        if: matrix.platform == 'linux-x64'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            zip unzip xvfb xauth libnss3 libgtk-3-0t64 libasound2t64 libgbm1 \
            libxss1 libxtst6 libatk-bridge2.0-0t64 libxkbcommon0

      - name: Native macOS Apple Silicon package
        if: matrix.platform == 'macos-arm64'
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          bun run make:desktop
          node scripts/ci/verify-macos-package.mjs
          node scripts/ci/verify-demo-package.mjs macos
          bash scripts/ci/smoke-macos-install.sh
          CAPTAINS_DIARY_E2E_PROFILE=core bun scripts/ci/smoke-electron.mjs
          bun scripts/ci/smoke-native-preferences.mjs

      - name: Native Linux x64 package
        if: matrix.platform == 'linux-x64'
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          bun run make:desktop
          node scripts/ci/verify-demo-package.mjs linux
          CAPTAINS_DIARY_E2E_PROFILE=core xvfb-run --auto-servernum bun scripts/ci/smoke-electron.mjs
          xvfb-run --auto-servernum bun scripts/ci/smoke-native-preferences.mjs

      - name: Native Windows x64 package
        if: matrix.platform == 'windows-x64'
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Windows"
          bun run make:windows
          CAPTAINS_DIARY_E2E_PROFILE=core bun scripts/ci/smoke-electron.mjs

      - name: Generate sanitized native-build receipt
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync,readdirSync,statSync} from 'node:fs';
          import path from 'node:path';
          const walk=(dir)=>readdirSync(dir,{withFileTypes:true}).flatMap(x=>{
            const p=path.join(dir,x.name);
            return x.isDirectory()?walk(p):x.isFile()&&p.endsWith('.zip')?[p]:[];
          });
          const files=walk('out/make/zip');
          if(files.length!==1)throw new Error('Expected exactly one native ZIP, got '+files.length);
          const file=files[0];
          const bytes=statSync(file).size;
          if(bytes<1024*1024)throw new Error('Package too small');
          const actual=path.basename(file);
          const wanted=process.platform==='darwin'?'darwin-arm64':
            process.platform==='win32'?'win32-x64':'linux-x64';
          if(!actual.includes(wanted))throw new Error('Unexpected ZIP platform '+actual);
          const receipt={
            schema:'captains.diary.github-native-build/v1',
            result:'PASS',
            exactGitLabCommit:process.env.SOURCE_SHA,
            platform:process.platform,arch:process.arch,
            packageName:actual,bytes,
            sha256:createHash('sha256').update(readFileSync(file)).digest('hex'),
            nativePackagedGuiSmoke:'PASS',
            releasePublished:false
          };
          writeFileSync('github-build-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          NODE

      # Intentionally never publish ZIPs from this public repo's CI. Electron bundles
      # source files; public release needs separate provenance/content/signing gates.
      - name: Upload public-safe receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diary-native-${{ matrix.platform }}-${{ inputs.source_sha }}
          path: source/github-build-receipt.json
          if-no-files-found: error
          retention-days: 14
